launch:
  # Select how many configured vehicles to launch. Valid values: 1 or 2.
  vehicle_mode: 2

  # One RRT process is created for each enabled entry. Algorithm parameters
  # below are shared; ros__parameters here only override the vehicle I/O. In
  # one-car mode only the first enabled entry is used.
  vehicles:
    - namespace: ego_racecar
      node_name: rrt_node
      ros__parameters:
        odom_topic: /ego_racecar/odom
        map_topic: /map
        scan_topic: /scan
        dynamic_map_topic: /ego_racecar/dynamic_map
        drive_topic: /drive
        control_topic: /ego_racecar/control
        # Commanded speed in m/s for straight, medium, and sharp turns.
        SPEED_STRAIGHT: 5.0
        SPEED_MEDIUM_TURN: 3.0
        SPEED_SHARP_TURN: 1.5
        # Cool palette: primary is path/goal/branches; accent is lookahead/nodes.
        VISUALIZATION_PRIMARY_COLOR: [0.10, 0.65, 1.00]
        VISUALIZATION_ACCENT_COLOR: [0.00, 1.00, 0.65]

    - namespace: opp_racecar
      node_name: rrt_node
      ros__parameters:
        odom_topic: /opp_racecar/odom
        map_topic: /map
        scan_topic: /opp_scan
        dynamic_map_topic: /opp_racecar/dynamic_map
        drive_topic: /opp_drive
        control_topic: /opp_racecar/control
        # These can be tuned independently from the ego vehicle.
        SPEED_STRAIGHT: 3.0
        SPEED_MEDIUM_TURN: 2.0
        SPEED_SHARP_TURN: 1.0
        # Warm palette, visually distinct from the ego vehicle.
        VISUALIZATION_PRIMARY_COLOR: [1.00, 0.42, 0.05]
        VISUALIZATION_ACCENT_COLOR: [1.00, 0.05, 0.55]

rrt_node:
  ros__parameters:
    use_sim_time: false

    # Shared start/stop command received by every configured RRT node.
    fleet_control_topic: /rrt/control

    # Keep false to run planning and visualization without moving the vehicle.
    start_on_launch: false

    # Set this once to an absolute path, or to a path relative to this YAML file.
    waypoint_file_path: '/home/plamephia/workspace/sim_ws/waypoint/Spielberg_map/filtered.csv'

    MARGIN: 0.2
    DISTANCE_GOAL_AHEAD: 3.5
    SCAN_RANGE: 4.0
    DETECTED_OBS_MARGIN: 0.22
    # Retain a rolling set of this vehicle's own LiDAR observations. Rebuilding
    # at a fixed rate avoids the old periodic clear/re-detect oscillation.
    DYNAMIC_OBSTACLE_PERSISTENCE: 0.30
    DYNAMIC_MAP_UPDATE_PERIOD: 0.05
    MIN_RRT_ITERATIONS: 1000
    MAX_RRT_ITERATIONS: 1200
    STD: 1.5
    STEP_SIZE: 0.3
    NEAR_RANGE: 1.0
    GOAL_TOLERANCE: 0.1
    GOAL_SAMPLE_RATE: 0.1
    RRT_WAYPOINT_INTERVAL: 0.2

    # Optimal-trajectory reference selection and safe RRT* rejoin.
    OPTIMAL_REJOIN_DISTANCE: 0.5
    # Conditions must remain clear for this long before leaving RRT mode.
    OPTIMAL_REJOIN_CLEAR_TIME: 0.75
    PROGRESS_SEARCH_BACKWARD: 2.0
    PROGRESS_SEARCH_FORWARD: 8.0
    PROJECTION_FALLBACK_DISTANCE: 2.5

    DISTANCE_LOOK_AHEAD: 0.8
    PID_P: 0.25

    # Shared steering thresholds used to select the three speed levels above.
    SPEED_LOW_STEERING_THRESHOLD_DEGREES: 10.0
    SPEED_MEDIUM_STEERING_THRESHOLD_DEGREES: 20.0

    # LiDAR-only fallback when RRT cannot find a detour. The speed cap is:
    # max(0, (first path collision distance - stop distance) * gain).
    BLOCKED_PATH_STOP_DISTANCE: 0.50
    BLOCKED_PATH_SPEED_GAIN: 2.0
